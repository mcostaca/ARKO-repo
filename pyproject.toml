[project]
name = "arkoapp"
version = "0.1.0"
description = "Teste tecnico para a empresa ARKO"
authors = [
    {name = "Matheus",email = "matheus.alves@uncisal.edu.br"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django (>=5.2.4,<6.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "django-tables2 (>=2.7.5,<3.0.0)",
    "d (>=0.2.2,<0.3.0)",
    "django-select2 (>=8.4.1,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
